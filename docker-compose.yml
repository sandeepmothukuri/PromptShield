name: promptshield-lab

# ------------------------------------------------------------------------------
# PromptShield-Lab — full SOC + LLM stack
# Brings up: Ollama, OpenWebUI, LLM-Monitor proxy, Wazuh, Suricata, Zeek,
# OpenSearch, OpenSearch Dashboards. One command, one network, persistent
# volumes. See docs/setup-guide.md for first-run steps.
# ------------------------------------------------------------------------------

networks:
  promptshield:
    driver: bridge

volumes:
  ollama_data:
  openwebui_data:
  wazuh_data:
  wazuh_etc:
  wazuh_logs:
  wazuh_indexer_data:
  opensearch_data:
  suricata_logs:
  zeek_logs:
  monitor_logs:
  shipper_state:

services:

  # ---------- LLM runtime ----------
  ollama:
    image: ollama/ollama:0.34.0
    container_name: psl-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    networks: [promptshield]

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.3.21
    container_name: psl-openwebui
    restart: unless-stopped
    # Depends on the monitor, not on Ollama: every chat request must traverse
    # the guardrail. Reaching Ollama directly bypasses classification, blocking
    # and telemetry entirely, which defeats the purpose of the lab.
    depends_on:
      llm-monitor:
        condition: service_healthy
    environment:
      # OpenWebUI talks to the monitor over the OpenAI-compatible protocol.
      # The /v1 suffix is required and the key must be non-empty even though the
      # monitor does not validate it. ENABLE_OLLAMA_API is off so the UI cannot
      # silently fall back to a direct, unmonitored connection.
      - OPENAI_API_BASE_URL=http://llm-monitor:8080/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-promptshield-lab}
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=true
    ports: ["3000:8080"]
    volumes: ["openwebui_data:/app/backend/data"]
    networks: [promptshield]

  # ---------- LLM monitoring / guardrails ----------
  llm-monitor:
    build: ./llm-monitor
    container_name: psl-llm-monitor
    restart: unless-stopped
    depends_on: [ollama]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3:8b}
      - LOG_PATH=${LOG_PATH:-/var/log/promptshield/monitor.json}
      - CLASSIFIER_THRESHOLD=${CLASSIFIER_THRESHOLD:-0.65}
      # Every variable documented in .env.example must be forwarded here,
      # otherwise it is dead config: setting it in .env would silently do
      # nothing. tests/test_env_consistency.py enforces this.
      # Default mirrors .env.example. 0.30 is derived from the classifier's
      # actual score set; 0.65 would leave the hunt-2 band empty.
      - FLAG_THRESHOLD=${FLAG_THRESHOLD:-0.30}
      - MAX_PROMPT_CHARS=${MAX_PROMPT_CHARS:-32000}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-20}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - MAX_LOGGED_COMPLETION_CHARS=${MAX_LOGGED_COMPLETION_CHARS:-4000}
      - REDACT_LOGGED_SECRETS=${REDACT_LOGGED_SECRETS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports: ["${LLM_MONITOR_PORT:-8080}:8080"]
    volumes:
      - monitor_logs:/var/log/promptshield
    networks: [promptshield]

  # ---------- SIEM ----------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: psl-wazuh-manager
    restart: unless-stopped
    hostname: wazuh.manager
    depends_on:
      - wazuh.indexer
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${WAZUH_INDEXER_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-MyS3cr37P450r.*-}
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_data:/var/ossec/queue
      - monitor_logs:/var/log/promptshield:ro
      # The generator emits a single root-ca.pem shared by all three nodes
      # (see config/certs.yml). An earlier revision mounted root-ca-manager.pem
      # here, which nothing creates: Docker auto-creates a missing bind-mount
      # source as a directory, so the manager received a directory where it
      # expected a PEM and failed TLS startup.
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./detections/wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - ./detections/wazuh/decoders.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml:ro
    networks: [promptshield]

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: psl-wazuh-indexer
    restart: unless-stopped
    hostname: wazuh.indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Host port 9201; 9200 belongs to the standalone OpenSearch service below
      - "${WAZUH_INDEXER_PORT:-9201}:9200"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    networks: [promptshield]

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: psl-wazuh-dashboard
    restart: unless-stopped
    hostname: wazuh.dashboard
    depends_on:
      - wazuh.indexer
    environment:
      - INDEXER_USERNAME=${WAZUH_INDEXER_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=${WAZUH_DASHBOARD_USER:-kibanaserver}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:-kibanaserver}
    ports:
      - "${WAZUH_DASHBOARD_PORT:-5601}:5601"
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    networks: [promptshield]

  # ---------- Network detection ----------
  suricata:
    image: jasonish/suricata:7.0.17
    container_name: psl-suricata
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, SYS_NICE]
    volumes:
      - suricata_logs:/var/log/suricata
      - ./detections/suricata/promptshield.rules:/etc/suricata/rules/promptshield.rules:ro
    command: -i eth0 -S /etc/suricata/rules/promptshield.rules

  zeek:
    image: blacktop/zeek:4.1.1
    container_name: psl-zeek
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - zeek_logs:/usr/local/zeek/logs
      - ./detections/zeek/llm_telemetry.zeek:/usr/local/zeek/share/zeek/site/llm_telemetry.zeek:ro
    command: zeek -i eth0 /usr/local/zeek/share/zeek/site/llm_telemetry.zeek

  # ---------- Telemetry shipping ----------
  # The proxy writes a local JSONL audit log. Without this service nothing
  # populates promptshield-* and every dashboard panel bound to it is empty.
  # See docs/telemetry-schema.md and tests/test_ship_logs.py.
  log-shipper:
    build: ./llm-monitor
    container_name: psl-log-shipper
    restart: unless-stopped
    depends_on:
      llm-monitor:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      - AUDIT_LOG=/var/log/promptshield/monitor.json
      - OPENSEARCH_URL=http://opensearch:9200
      - INDEX_PREFIX=promptshield
    volumes:
      # Read-only: the shipper must not be able to alter the audit log.
      - monitor_logs:/var/log/promptshield:ro
      # Writable, for the byte-offset registry. Keeping this in a separate
      # volume is what lets the log mount stay read-only; without it the
      # default registry path would land inside the :ro mount.
      - shipper_state:/var/lib/promptshield-shipper
      - ./scripts/ship_logs.py:/app/scripts/ship_logs.py:ro
      - ./config/opensearch:/app/config/opensearch:ro
    command: >
      python /app/scripts/ship_logs.py
      --log /var/log/promptshield/monitor.json
      --registry /var/lib/promptshield-shipper/monitor.json.offset
      --opensearch http://opensearch:9200
      --follow --interval 5 --ensure-template
    networks: [promptshield]

  # ---------- Search / dashboards ----------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: psl-opensearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["${OPENSEARCH_PORT:-9200}:9200"]
    volumes: ["opensearch_data:/usr/share/opensearch/data"]
    networks: [promptshield]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: psl-opensearch-dashboards
    restart: unless-stopped
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["${OPENSEARCH_DASHBOARDS_PORT:-5602}:5601"]
    networks: [promptshield]
