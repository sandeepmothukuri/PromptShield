[project]
name = "promptshield-lab"
version = "0.2.0"
description = "AI security and SOC detection engineering lab: simulate LLM attacks, detect them, hunt them, respond to them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Mothukuri" }]

dependencies = []

[project.scripts]
promptshield = "promptshield_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff==0.16.7",
    "yamllint==1.35.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "llm-monitor/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "docs/captures",
    "config/wazuh_indexer_ssl_certs",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "S",
    "DTZ",
    "RUF",
    "EXE",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"llm-monitor/tests/*" = ["S101", "S105", "S106"]
"llm-monitor/classifier.py" = ["S105"]
"llm-monitor/langchain_guard.py" = ["S105"]
"simulations/*" = ["S105", "S106", "S311"]
"scripts/*" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["classifier", "proxy", "langchain_guard"]
