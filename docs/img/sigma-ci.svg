<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Continuous integration pipeline</title>
  <desc id="desc">The four jobs defined in .github/workflows/ci.yml, the commands each one runs, and the pinned tool versions. Drawn from the workflow file, not captured from GitHub.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1360" height="520" fill="#f8fafc"/>
  <text x="48" y="50" font-size="25" font-weight="700" fill="#0f172a">CI pipeline &#183; .github/workflows/ci.yml</text>
  <text x="48" y="76" font-size="14" fill="#475569">Illustrative diagram drawn from the workflow file &#8212; not a screenshot of a CI run. Job names, commands and pinned versions match the file exactly.</text>
  <line x1="48" y1="94" x2="1312" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="48" y="124" font-size="13" font-weight="700" fill="#0f172a">Triggers</text>
  <g font-size="12.5" fill="#334155">
    <rect x="120" y="108" width="196" height="26" rx="13" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="218" y="126" text-anchor="middle" font-family="monospace">on: push</text>
    <rect x="330" y="108" width="196" height="26" rx="13" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="428" y="126" text-anchor="middle" font-family="monospace">on: pull_request</text>
  </g>

  <!-- four parallel jobs -->
  <g font-size="13" fill="#0f172a">
    <rect x="48" y="168" width="296" height="176" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="196" y="194" text-anchor="middle" font-weight="700">lint-python</text>
    <text x="196" y="214" text-anchor="middle" font-size="11.5" fill="#475569">ubuntu-latest</text>
    <text x="196" y="244" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="monospace">ruff check .</text>
    <text x="196" y="259" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="monospace">ruff format --check .</text>
    <text x="196" y="290" text-anchor="middle" font-size="11" fill="#475569">config: pyproject.toml</text>
    <text x="196" y="308" text-anchor="middle" font-size="11" fill="#475569">[tool.ruff]</text>

    <rect x="368" y="168" width="296" height="176" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="516" y="194" text-anchor="middle" font-weight="700">validate-sigma</text>
    <text x="516" y="214" text-anchor="middle" font-size="11.5" fill="#475569">ubuntu-latest</text>
    <text x="516" y="244" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="monospace">sigma check detections/sigma</text>
    <text x="516" y="290" text-anchor="middle" font-size="11" fill="#475569">10 rules &#183; must report</text>
    <text x="516" y="308" text-anchor="middle" font-size="11" fill="#475569">0 errors, 0 issues</text>

    <rect x="688" y="168" width="296" height="176" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="836" y="194" text-anchor="middle" font-weight="700">yaml-lint</text>
    <text x="836" y="214" text-anchor="middle" font-size="11.5" fill="#475569">ubuntu-latest</text>
    <text x="836" y="244" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="monospace">yamllint -c .yamllint.yml .</text>
    <text x="836" y="290" text-anchor="middle" font-size="11" fill="#475569">Sigma rules, compose,</text>
    <text x="836" y="308" text-anchor="middle" font-size="11" fill="#475569">Atomic Red Team YAML</text>

    <rect x="1008" y="168" width="304" height="176" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1160" y="194" text-anchor="middle" font-weight="700">detection-tests</text>
    <text x="1160" y="214" text-anchor="middle" font-size="11.5" fill="#475569">ubuntu-latest</text>
    <text x="1160" y="244" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="monospace">pytest tests/ llm-monitor/tests/</text>
    <text x="1160" y="290" text-anchor="middle" font-size="11" fill="#475569">411 passed, 13 skipped</text>
    <text x="1160" y="308" text-anchor="middle" font-size="11" fill="#475569">across 9 suites</text>
  </g>

  <!-- triggers to jobs -->
  <g stroke="#334155" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <path d="M218 134 L196 162"/>
    <path d="M428 134 L516 162"/>
    <path d="M428 134 L836 162"/>
    <path d="M428 134 L1160 162"/>
  </g>

  <!-- pinned versions -->
  <line x1="48" y1="372" x2="1312" y2="372" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="400" font-size="13" font-weight="700" fill="#0f172a">Pinned tool versions</text>
  <g font-size="12" fill="#334155" font-family="monospace">
    <rect x="48" y="416" width="236" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="436">Python 3.11</text>
    <rect x="296" y="416" width="236" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="308" y="436">ruff 0.16.7</text>
    <rect x="544" y="416" width="236" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="556" y="436">yamllint 1.35.1</text>
    <rect x="792" y="416" width="236" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="804" y="436">sigma-cli 3.1.0</text>
    <rect x="1040" y="416" width="272" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1052" y="436">pySigma 1.5.0 + opensearch 2.0.3</text>
  </g>

  <text x="48" y="478" font-size="12" fill="#64748b">Versions are pinned because ruff&#8217;s default rule set and pySigma&#8217;s validator behaviour both change between releases; an unpinned install is not reproducible.</text>
  <text x="48" y="498" font-size="12" fill="#64748b">A separate pull_request workflow, sigma-validate.yml, additionally converts every rule to OpenSearch Lucene and fails if any rule produces an empty query.</text>
</svg>
