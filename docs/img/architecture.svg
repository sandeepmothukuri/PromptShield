<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">PromptShield-Lab reference architecture</title>
  <desc id="desc">Layered architecture: attack surface, application and monitoring, telemetry, detection, SIEM and search, and the analyst layer.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1360" height="900" fill="#f8fafc"/>
  <text x="48" y="52" font-size="27" font-weight="700" fill="#0f172a">PromptShield-Lab</text>
  <text x="48" y="80" font-size="15" fill="#475569">AI security and SOC detection engineering lab &#183; single compose network &#183; all components self-hosted</text>
  <line x1="48" y1="98" x2="1312" y2="98" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ============ LAYER 1: ATTACK SURFACE ============ -->
  <rect x="48" y="120" width="1264" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="68" y="146" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b91c1c">1 &#183; ATTACK SURFACE</text>

  <g font-size="13" fill="#0f172a">
    <rect x="72" y="160" width="196" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="170" y="184" text-anchor="middle" font-weight="600">simulations/</text>
    <text x="170" y="203" text-anchor="middle" font-size="11" fill="#64748b">adversary emulation</text>

    <rect x="292" y="160" width="196" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="390" y="184" text-anchor="middle" font-weight="600">datasets/*.jsonl</text>
    <text x="390" y="203" text-anchor="middle" font-size="11" fill="#64748b">72 labelled prompts</text>

    <rect x="512" y="160" width="196" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="610" y="184" text-anchor="middle" font-weight="600">scripts/ingest_logs.py</text>
    <text x="610" y="203" text-anchor="middle" font-size="11" fill="#64748b">corpus replay</text>

    <rect x="732" y="160" width="230" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="847" y="184" text-anchor="middle" font-weight="600">atomic_red_team/</text>
    <text x="847" y="203" text-anchor="middle" font-size="11" fill="#64748b">Invoke-AtomicRedTeam defs</text>

    <rect x="986" y="160" width="302" height="62" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1137" y="180" text-anchor="middle" font-weight="600">10 scenarios</text>
    <text x="1137" y="199" text-anchor="middle" font-size="10.5" fill="#64748b">injection &#183; jailbreak &#183; exfil &#183; phishing &#183; DoS</text>
    <text x="1137" y="214" text-anchor="middle" font-size="10.5" fill="#64748b">output handling</text>
  </g>

  <!-- ============ LAYER 2: APPLICATION ============ -->
  <rect x="48" y="264" width="816" height="152" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="68" y="290" font-size="12" font-weight="700" letter-spacing="1.2" fill="#1d4ed8">2 &#183; APPLICATION AND MONITORING</text>

  <g font-size="13" fill="#0f172a">
    <rect x="72" y="304" width="176" height="94" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="160" y="330" text-anchor="middle" font-weight="600">OpenWebUI</text>
    <text x="160" y="350" text-anchor="middle" font-size="11" fill="#64748b">chat front-end</text>
    <text x="160" y="368" text-anchor="middle" font-size="10.5" fill="#94a3b8">:3000</text>

    <rect x="300" y="304" width="272" height="94" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="436" y="328" text-anchor="middle" font-weight="700">LLM-Monitor proxy</text>
    <text x="436" y="347" text-anchor="middle" font-size="11" fill="#334155">classifier.py &#183; langchain_guard.py</text>
    <text x="436" y="364" text-anchor="middle" font-size="11" fill="#64748b">/chat &#183; /v1/chat/completions</text>
    <text x="436" y="382" text-anchor="middle" font-size="10.5" fill="#94a3b8">:8080 &#183; non-root &#183; rate limited</text>

    <rect x="624" y="304" width="216" height="94" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="732" y="330" text-anchor="middle" font-weight="600">Ollama</text>
    <text x="732" y="350" text-anchor="middle" font-size="11" fill="#64748b">local model runtime</text>
    <text x="732" y="368" text-anchor="middle" font-size="10.5" fill="#94a3b8">:11434</text>
  </g>

  <!-- ============ LAYER 3: TELEMETRY ============ -->
  <rect x="48" y="440" width="816" height="128" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="68" y="466" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0f766e">3 &#183; TELEMETRY</text>

  <rect x="72" y="480" width="380" height="72" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="262" y="504" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">/var/log/promptshield/monitor.json</text>
  <text x="262" y="524" text-anchor="middle" font-size="11" fill="#64748b">one JSON event per inference request</text>
  <text x="262" y="541" text-anchor="middle" font-size="10.5" fill="#94a3b8">27 documented fields &#183; docs/telemetry-schema.md</text>

  <rect x="484" y="480" width="356" height="72" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="662" y="504" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Suricata eve.json &#183; Zeek llm.log</text>
  <text x="662" y="524" text-anchor="middle" font-size="11" fill="#64748b">wire-level context, host capture</text>
  <text x="662" y="541" text-anchor="middle" font-size="10.5" fill="#b45309">not shipped to the index &#183; see docs/network-detection.md</text>

  <!-- ============ LAYER 4: DETECTION ============ -->
  <rect x="888" y="264" width="424" height="304" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="908" y="290" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6d28d9">4 &#183; DETECTION</text>

  <g font-size="12.5" fill="#0f172a">
    <rect x="908" y="304" width="384" height="58" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1100" y="327" text-anchor="middle" font-weight="600">Sigma &#183; 10 rules</text>
    <text x="1100" y="346" text-anchor="middle" font-size="10.5" fill="#64748b">validated by sigma check + pytest</text>

    <rect x="908" y="372" width="384" height="58" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1100" y="395" text-anchor="middle" font-weight="600">Wazuh rules 100100&#8211;100190</text>
    <text x="1100" y="414" text-anchor="middle" font-size="10.5" fill="#64748b">decoder + MITRE tagging + correlation</text>

    <rect x="908" y="440" width="186" height="54" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1001" y="462" text-anchor="middle" font-weight="600">Suricata</text>
    <text x="1001" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">7 signatures</text>

    <rect x="1106" y="440" width="186" height="54" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1199" y="462" text-anchor="middle" font-weight="600">Zeek</text>
    <text x="1199" y="479" text-anchor="middle" font-size="10.5" fill="#64748b">llm_telemetry.zeek</text>

    <rect x="908" y="504" width="384" height="50" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1100" y="525" text-anchor="middle" font-size="11" fill="#6d28d9">ATT&#38;CK v19.2 &#183; ATLAS v5.6 &#183; OWASP LLM 2025</text>
    <text x="1100" y="541" text-anchor="middle" font-size="10.5" fill="#8b5cf6">mappings enforced by tests/test_attack_mappings.py</text>
  </g>

  <!-- ============ LAYER 5: SIEM / SEARCH ============ -->
  <rect x="48" y="592" width="816" height="120" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="68" y="618" font-size="12" font-weight="700" letter-spacing="1.2" fill="#c2410c">5 &#183; SIEM AND SEARCH</text>

  <g font-size="13" fill="#0f172a">
    <rect x="72" y="632" width="240" height="62" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="192" y="656" text-anchor="middle" font-weight="600">Wazuh indexer</text>
    <text x="192" y="675" text-anchor="middle" font-size="11" fill="#64748b">wazuh-alerts-* &#183; :9201</text>

    <rect x="336" y="632" width="240" height="62" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="456" y="656" text-anchor="middle" font-weight="600">promptshield-*</text>
    <text x="456" y="675" text-anchor="middle" font-size="11" fill="#64748b">LLM telemetry index</text>

    <rect x="600" y="632" width="240" height="62" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="720" y="656" text-anchor="middle" font-weight="600">Dashboards</text>
    <text x="720" y="675" text-anchor="middle" font-size="11" fill="#64748b">12 panels &#183; :5602</text>
  </g>

  <!-- ============ LAYER 6: ANALYST ============ -->
  <rect x="888" y="592" width="424" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="908" y="618" font-size="12" font-weight="700" letter-spacing="1.2" fill="#15803d">6 &#183; ANALYST</text>
  <g font-size="12.5" fill="#0f172a">
    <rect x="908" y="632" width="186" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1001" y="655" text-anchor="middle" font-weight="600">hunting/</text>
    <text x="1001" y="673" text-anchor="middle" font-size="10.5" fill="#64748b">11 queries</text>

    <rect x="1106" y="632" width="186" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1199" y="655" text-anchor="middle" font-weight="600">playbooks/</text>
    <text x="1199" y="673" text-anchor="middle" font-size="10.5" fill="#64748b">4 IR playbooks</text>
  </g>

  <!-- ============ FLOWS ============ -->
  <g stroke-width="2" fill="none">
    <path d="M170,222 L170,304" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <path d="M390,222 L400,304" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <path d="M248,351 L300,351" stroke="#2563eb" marker-end="url(#arr)"/>
    <path d="M572,351 L624,351" stroke="#2563eb" marker-end="url(#arr)"/>
    <path d="M436,398 L436,440" stroke="#0d9488" marker-end="url(#arr)"/>
    <path d="M452,516 L744,516 L744,568 L1100,568 L1100,554" stroke="#0d9488" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M452,530 L456,592" stroke="#ea580c" marker-end="url(#arr)"/>
    <path d="M908,401 L864,401 L864,470 L470,470 L470,500" stroke="#7c3aed" stroke-dasharray="5 4"/>
    <path d="M1100,554 L1100,592" stroke="#7c3aed" marker-end="url(#arr)"/>
    <path d="M840,663 L860,663 L860,652 L888,652" stroke="#16a34a" marker-end="url(#arrGreen)"/>
    <path d="M312,663 L336,663" stroke="#ea580c" marker-end="url(#arr)"/>
    <path d="M576,663 L600,663" stroke="#ea580c" marker-end="url(#arr)"/>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="48" y="736" width="1264" height="124" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="68" y="762" font-size="12" font-weight="700" letter-spacing="1.2" fill="#334155">LEGEND AND CONSTRAINTS</text>

  <g font-size="11.5" fill="#334155">
    <line x1="72" y1="784" x2="112" y2="784" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="122" y="788">attack traffic</text>

    <line x1="230" y1="784" x2="270" y2="784" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
    <text x="280" y="788">request path</text>

    <line x1="388" y1="784" x2="428" y2="784" stroke="#0d9488" stroke-width="2" marker-end="url(#arr)"/>
    <text x="438" y="788">telemetry write</text>

    <line x1="560" y1="784" x2="600" y2="784" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="610" y="788">detection logic</text>

    <line x1="726" y1="784" x2="766" y2="784" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="776" y="788">analyst workflow</text>

    <text x="72" y="816" font-weight="600" fill="#0f172a">Implemented</text>
    <text x="72" y="834">Proxy classification and blocking, audit telemetry, Wazuh decoder and 10 rules, 10 Sigma rules, dashboard bundle, hunting queries, playbooks, CI.</text>

    <text x="72" y="854" font-weight="600" fill="#b45309">Documented limitation</text>
    <text x="72" y="872" fill="#92400e">Suricata and Zeek run on the host interface and their logs are not shipped into the search index, so their panels are intentionally absent. Details in docs/network-detection.md.</text>
  </g>
</svg>
