<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">SOC investigation workflow and correlation</title>
  <desc id="desc">How an analyst moves from a Wazuh alert to the originating request using request_id, session_id, user and prompt_hash.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1360" height="560" fill="#f8fafc"/>
  <text x="48" y="50" font-size="25" font-weight="700" fill="#0f172a">SOC investigation</text>
  <text x="48" y="76" font-size="14" fill="#475569">From alert to root cause. Each step names the identifier that carries the investigation forward.</text>
  <line x1="48" y1="94" x2="1312" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="13" fill="#0f172a">
    <rect x="48" y="120" width="286" height="132" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="191" y="146" text-anchor="middle" font-weight="700">1 &#183; Alert triage</text>
    <text x="191" y="170" text-anchor="middle" font-size="11.5" fill="#475569">Wazuh security events</text>
    <text x="191" y="196" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#9a3412">rule.groups: promptshield</text>
    <text x="191" y="213" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#9a3412">rule.level &gt;= 10</text>
    <text x="191" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">read rule.description, rule.mitre.id</text>

    <rect x="374" y="120" width="286" height="132" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="517" y="146" text-anchor="middle" font-weight="700">2 &#183; Recover the event</text>
    <text x="517" y="170" text-anchor="middle" font-size="11.5" fill="#475569">promptshield-* by request_id</text>
    <text x="517" y="196" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6d28d9">term: request_id</text>
    <text x="517" y="213" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6d28d9">&#8594; prompt, classifier_score</text>
    <text x="517" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">confirms what was actually sent</text>

    <rect x="700" y="120" width="286" height="132" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="843" y="146" text-anchor="middle" font-weight="700">3 &#183; Establish scope</text>
    <text x="843" y="170" text-anchor="middle" font-size="11.5" fill="#475569">expand on session / user / IP</text>
    <text x="843" y="196" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#15803d">terms: session_id, user</text>
    <text x="843" y="213" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#15803d">terms: source_ip, prompt_hash</text>
    <text x="843" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">one user? many users? one payload?</text>

    <rect x="1026" y="120" width="286" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1169" y="146" text-anchor="middle" font-weight="700">4 &#183; Assess impact</text>
    <text x="1169" y="170" text-anchor="middle" font-size="11.5" fill="#475569">did anything leave?</text>
    <text x="1169" y="196" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#b91c1c">secrets_in_completion</text>
    <text x="1169" y="213" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#b91c1c">verdict: allow</text>
    <text x="1169" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">blocked = contained; allowed = investigate</text>
  </g>

  <g stroke-width="2" fill="none">
    <path d="M334,186 L374,186" stroke="#334155" marker-end="url(#a)"/>
    <path d="M660,186 L700,186" stroke="#334155" marker-end="url(#a)"/>
    <path d="M986,186 L1026,186" stroke="#334155" marker-end="url(#a)"/>
  </g>

  <!-- correlation keys panel -->
  <rect x="48" y="284" width="620" height="232" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="68" y="312" font-size="14" font-weight="700" fill="#0f172a">Correlation identifiers</text>
  <text x="68" y="332" font-size="11.5" fill="#475569">Four keys, four different questions. All are written by the proxy on every request.</text>

  <g font-size="11.5" fill="#334155">
    <rect x="68" y="348" width="150" height="42" rx="5" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="143" y="366" text-anchor="middle" font-family="monospace" font-weight="700" fill="#0f766e">request_id</text>
    <text x="143" y="382" text-anchor="middle" font-size="10" fill="#64748b">one request</text>
    <text x="232" y="366" font-size="11">Proves an alert corresponds to a specific request</text>
    <text x="232" y="382" font-size="11">rather than inferring it from timestamps.</text>

    <rect x="68" y="398" width="150" height="42" rx="5" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="143" y="416" text-anchor="middle" font-family="monospace" font-weight="700" fill="#0f766e">session_id</text>
    <text x="143" y="432" text-anchor="middle" font-size="10" fill="#64748b">one conversation</text>
    <text x="232" y="416" font-size="11">Shows escalation within a conversation, e.g.</text>
    <text x="232" y="432" font-size="11">extraction attempt followed by tool abuse.</text>

    <rect x="68" y="448" width="150" height="42" rx="5" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="143" y="466" text-anchor="middle" font-family="monospace" font-weight="700" fill="#0f766e">user / source_ip</text>
    <text x="143" y="482" text-anchor="middle" font-size="10" fill="#64748b">one identity</text>
    <text x="232" y="466" font-size="11">Breadth across attack types distinguishes a</text>
    <text x="232" y="482" font-size="11">determined actor from a curious employee.</text>

    <rect x="68" y="498" width="150" height="10" rx="5" fill="#f0fdfa" stroke="#0d9488"/>
  </g>

  <!-- hunt panel -->
  <rect x="692" y="284" width="620" height="232" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="712" y="312" font-size="14" font-weight="700" fill="#0f172a">Close the loop</text>
  <text x="712" y="332" font-size="11.5" fill="#475569">An investigation that does not change a detection will be repeated next quarter.</text>

  <g font-size="11.5" fill="#334155">
    <rect x="712" y="348" width="284" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="854" y="370" text-anchor="middle" font-weight="600" fill="#15803d">Add a classifier indicator</text>
    <text x="854" y="388" text-anchor="middle" font-size="10.5" fill="#64748b">llm-monitor/classifier.py</text>
    <text x="854" y="404" text-anchor="middle" font-size="10.5" fill="#64748b">weight it, add the sample to datasets/</text>

    <rect x="1008" y="348" width="284" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1150" y="370" text-anchor="middle" font-weight="600" fill="#15803d">Add or tune a Sigma rule</text>
    <text x="1150" y="388" text-anchor="middle" font-size="10.5" fill="#64748b">detections/sigma/</text>
    <text x="1150" y="404" text-anchor="middle" font-size="10.5" fill="#64748b">must fire on a corpus sample</text>

    <rect x="712" y="424" width="284" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="854" y="446" text-anchor="middle" font-weight="600" fill="#15803d">Promote the hunt</text>
    <text x="854" y="464" text-anchor="middle" font-size="10.5" fill="#64748b">hunting/opensearch_queries.md</text>
    <text x="854" y="480" text-anchor="middle" font-size="10.5" fill="#64748b">objective, triage, escalation, pivot</text>

    <rect x="1008" y="424" width="284" height="66" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1150" y="446" text-anchor="middle" font-weight="600" fill="#15803d">Update the playbook</text>
    <text x="1150" y="464" text-anchor="middle" font-size="10.5" fill="#64748b">playbooks/</text>
    <text x="1150" y="480" text-anchor="middle" font-size="10.5" fill="#64748b">record the new triage decision</text>
  </g>
</svg>
