name: Sigma Validate

on:
  pull_request:
    paths: ["detections/sigma/**"]

jobs:
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install sigma-cli pysigma pysigma-backend-opensearch
      - run: sigma check detections/sigma
      - name: Convert to OpenSearch query strings
        run: sigma convert -t opensearch detections/sigma -o /tmp/converted.json
      - uses: actions/upload-artifact@v4
        with:
          name: opensearch-queries
          path: /tmp/converted.json
